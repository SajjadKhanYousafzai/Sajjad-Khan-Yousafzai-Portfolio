<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  
  <defs>
    <linearGradient id="circleGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glowing Circular Ring -->
  <circle 
    cx="32" 
    cy="32" 
    r="25" 
    stroke="url(#circleGrad)" 
    stroke-width="2.8" 
    fill="rgba(6, 182, 212, 0.06)"
    filter="url(#neonGlow)"
  />

  <!-- Inner Concentric Tech Ring -->
  <circle 
    cx="32" 
    cy="32" 
    r="21.5" 
    stroke="url(#circleGrad)" 
    stroke-width="1" 
    stroke-opacity="0.45"
    stroke-dasharray="8 4"
    fill="none"
  />

  <!-- Center Stylized Superhero 'S' Monogram -->
  <path 
    d="M 43 20 L 26 20 C 20.5 20 18 24.5 22 28.5 L 38 34 C 43 36 43.5 42 38 44 L 20 44" 
    stroke="url(#letterGrad)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
    filter="url(#neonGlow)"
  />

  <!-- Top-Right Sharp Wing/Chevron Accent -->
  <path 
    d="M 43 17.5 L 48 22.5 L 40 22.5" 
    fill="url(#letterGrad)"
  />

  <!-- Bottom-Left Sharp Wing/Chevron Accent -->
  <path 
    d="M 21 46.5 L 16 41.5 L 24 41.5" 
    fill="url(#letterGrad)"
  />

  <!-- Subtle Core Light Accent -->
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
